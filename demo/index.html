<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0A0B0D" />
  <title>BUYBIZ Demo</title>
  
  <style>:root {
  --ink: #0a0b0d;
  --muted: #6e7178;
  --soft: #8c9097;
  --line: #e4e5e8;
  --bg: #f4f4f5;
  --surface: #ffffff;
  --green: #16794a;
  --green-soft: #eaf8f0;
  --amber: #946200;
  --amber-soft: #fff8e8;
  --red: #b42318;
  --red-soft: #fff1f0;
  --radius: 16px;
  --shadow: 0 24px 60px -46px rgba(0,0,0,.45);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font-family: "DM Sans", system-ui, sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button, input, textarea { font: inherit; }
button { cursor: pointer; }
.mono { font-family: "JetBrains Mono", monospace; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.tiny { font-size: 10.5px; }
.app { display: flex; min-height: 100dvh; }
.sidebar { width: 238px; background: #0a0b0d; color: #fff; padding: 20px 14px; display: flex; flex-direction: column; position: fixed; inset: 0 auto 0 0; z-index: 30; }
.brand { display: flex; align-items: center; gap: 9px; padding: 2px 6px 22px; }
.logo { width: 28px; height: 28px; border-radius: 8px; background: #fff; color: #0a0b0d; display: grid; place-items: center; font-size: 16px; font-weight: 800; }
.brand strong { font-size: 16px; letter-spacing: -.03em; }
.side-label { color: #6f737a; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; padding: 14px 10px 6px; }
.side-nav { display: grid; gap: 2px; }
.side-link { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: #b9bcc2; font-size: 12px; transition: background .15s ease, color .15s ease; }
.side-link:hover { background: #1a1c20; color: #fff; }
.side-link.active { background: #24272c; color: #fff; }
.side-link svg { width: 15px; height: 15px; opacity: .8; }
.side-foot { margin-top: auto; border-top: 1px solid #202226; padding: 14px 6px 2px; display: flex; align-items: center; gap: 9px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: #f0d9c8; color: #4b2b13; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.side-foot p { margin: 0; font-size: 11px; }
.side-foot span { color: #7d8189; font-size: 9px; }
.main { margin-left: 238px; width: calc(100% - 238px); min-height: 100dvh; }
.topbar { height: 60px; background: rgba(255,255,255,.86); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; padding: 0 22px; position: sticky; top: 0; z-index: 20; backdrop-filter: blur(12px); }
.search { flex: 1; max-width: 390px; position: relative; }
.search input { width: 100%; height: 30px; border: 0; background: #f5f5f6; border-radius: 999px; padding: 0 12px 0 32px; font-size: 11px; outline: none; }
.search svg { position: absolute; left: 11px; top: 8px; width: 13px; height: 13px; color: #9b9ea4; }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: #fff; height: 30px; padding: 0 11px; border-radius: 999px; font-size: 10.5px; color: #4f5258; }
.demo-pill { border-color: #ead8bd; background: #fffaf1; color: #946200; }
.content { padding: 30px; max-width: 1240px; margin: 0 auto; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
.eyebrow { color: var(--soft); text-transform: uppercase; letter-spacing: .12em; font-size: 9.5px; font-weight: 700; }
h1 { font-size: 30px; letter-spacing: -.045em; line-height: 1.05; margin: 7px 0 0; }
h2 { font-size: 16px; letter-spacing: -.025em; margin: 0; }
h3 { font-size: 13px; margin: 0; }
.sub { color: var(--muted); font-size: 11.5px; line-height: 1.6; margin: 7px 0 0; }
.grid { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-pad { padding: 22px; }
.dark-card { background: #0a0b0d; color: #fff; border-color: #22252a; }
.dark-card .sub, .dark-card .eyebrow { color: rgba(255,255,255,.48); }
.balance { font-size: 36px; letter-spacing: -.06em; font-weight: 600; margin: 9px 0 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; border-radius: 999px; padding: 0 17px; border: 1px solid transparent; font-size: 11px; font-weight: 600; transition: opacity .15s ease, background .15s ease; }
.btn:hover { opacity: .88; }
.btn-dark { background: var(--ink); color: #fff; }
.btn-light { background: #fff; color: var(--ink); }
.btn-outline { background: transparent; border-color: var(--line); color: #4d5056; }
.btn-sm { height: 32px; padding: 0 12px; font-size: 10px; }
.status { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 4px 8px; font-size: 9.5px; font-weight: 600; }
.status.green { color: var(--green); background: var(--green-soft); }
.status.amber { color: var(--amber); background: var(--amber-soft); }
.status.grey { color: #62666d; background: #f2f3f5; }
.status.red { color: var(--red); background: var(--red-soft); }
.two { display: grid; grid-template-columns: 1.3fr .7fr; gap: 14px; }
.three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 11px; padding: 13px; background: #fbfbfc; }
.stat label { display: block; color: var(--muted); font-size: 9.5px; }
.stat strong { display: block; margin-top: 7px; font-size: 20px; letter-spacing: -.035em; }
.section-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 24px 0 11px; }
.list { display: grid; }
.row { display: flex; align-items: center; gap: 11px; padding: 13px 0; border-bottom: 1px solid #eff0f2; }
.row:last-child { border-bottom: 0; }
.row-icon { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #f4f5f6; color: #5c6067; flex: none; }
.row-icon.in { background: var(--green-soft); color: var(--green); }
.row-main { min-width: 0; flex: 1; }
.row-main strong { display: block; font-size: 12px; font-weight: 600; }
.row-main span { display: block; color: var(--muted); font-size: 10px; margin-top: 3px; }
.amount { font-size: 12px; font-weight: 700; white-space: nowrap; }
.amount.in { color: var(--green); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 11px; }
th { text-align: left; color: var(--soft); text-transform: uppercase; letter-spacing: .08em; font-size: 8.5px; font-weight: 600; padding: 12px 14px; background: #fbfbfc; border-bottom: 1px solid var(--line); }
td { padding: 13px 14px; border-bottom: 1px solid #eff0f2; }
tr:last-child td { border-bottom: 0; }
.campaign { overflow: hidden; border-radius: 18px; border: 1px solid var(--line); background: #fff; }
.campaign-inner { padding: 24px; }
.reward-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.reward { border: 1px solid var(--line); background: #fbfbfc; border-radius: 12px; padding: 16px; }
.reward span { display: block; color: var(--muted); font-size: 9.5px; text-transform: uppercase; letter-spacing: .1em; }
.reward strong { display: block; font-size: 34px; letter-spacing: -.05em; margin-top: 8px; }
.meta-line { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 10.5px; margin-top: 9px; }
.withdraw-banner { background: #0a0b0d; color: #fff; border-radius: 16px; padding: 24px; display: flex; justify-content: space-between; gap: 20px; align-items: center; }
.withdraw-banner .amount { font-size: 34px; letter-spacing: -.05em; }
.timeline { position: relative; padding-left: 22px; }
.timeline:before { content:""; position: absolute; left: 6px; top: 7px; bottom: 8px; width: 1px; background: var(--line); }
.timeline-item { position: relative; padding-bottom: 21px; }
.timeline-item:last-child { padding-bottom: 0; }
.timeline-item:before { content:""; position: absolute; left: -21px; top: 4px; width: 9px; height: 9px; border-radius: 50%; background: #fff; border: 2px solid #b9bdc4; }
.timeline-item.done:before { background: var(--green); border-color: var(--green); }
.timeline-item strong { display: block; font-size: 11.5px; }
.timeline-item span { display: block; color: var(--muted); font-size: 10px; margin-top: 3px; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.detail label { display: block; color: var(--soft); text-transform: uppercase; letter-spacing: .08em; font-size: 8.5px; margin-bottom: 6px; }
.detail p { margin: 0; font-size: 11.5px; line-height: 1.5; }
.address-box { display: flex; gap: 8px; align-items: center; background: #f8f8f9; border: 1px solid var(--line); padding: 9px 10px; border-radius: 8px; }
.address-box code { font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.icon-btn { border: 1px solid var(--line); width: 28px; height: 28px; border-radius: 7px; background: #fff; display: grid; place-items: center; color: #5f636a; }
.alert { border: 1px solid #ead8bd; background: #fffaf1; color: #7d5700; padding: 11px 13px; border-radius: 9px; font-size: 10px; line-height: 1.6; }
.alert.dark { border-color: #24272c; background: #111317; color: rgba(255,255,255,.65); }
.form { display: grid; gap: 13px; }
.field label { display: block; font-size: 10.5px; font-weight: 600; margin-bottom: 6px; }
.field input, .field textarea, .field select { width: 100%; border: 1px solid var(--line); border-radius: 9px; background: #fff; padding: 11px 12px; font-size: 12px; outline: none; }
.field input:focus, .field textarea:focus { border-color: #8b8f96; box-shadow: 0 0 0 3px rgba(10,11,13,.04); }
.login-wrap { min-height: 100dvh; display: grid; grid-template-columns: 1fr 1fr; background: #f4f4f5; }
.login-art { background: #0a0b0d; color: #fff; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
.login-art:after { content:""; position: absolute; width: 470px; height: 470px; border: 1px solid rgba(255,255,255,.08); border-radius: 50%; right: -160px; top: 80px; }
.login-art h2 { font-size: 44px; line-height: 1.02; letter-spacing: -.055em; margin-top: 60px; }
.login-art p { color: rgba(255,255,255,.48); font-size: 12px; line-height: 1.7; max-width: 360px; }
.login-box { display: grid; place-items: center; padding: 30px; }
.login-card { width: 100%; max-width: 390px; }
.login-card h1 { font-size: 30px; }
.demo-access { margin-top: 18px; padding: 13px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-size: 10px; line-height: 1.7; color: var(--muted); }
.demo-access code { color: var(--ink); font-family: "JetBrains Mono", monospace; }
.chat { display: grid; grid-template-rows: auto 1fr auto; min-height: 520px; }
.chat-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.bot { width: 30px; height: 30px; border-radius: 9px; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.messages { padding: 18px; display: flex; flex-direction: column; gap: 12px; max-height: 420px; overflow-y: auto; }
.msg { max-width: 82%; padding: 10px 12px; border-radius: 12px; font-size: 11px; line-height: 1.6; white-space: pre-wrap; }
.msg.bot { align-self: flex-start; background: #f4f5f6; border-bottom-left-radius: 3px; }
.msg.user { align-self: flex-end; background: var(--ink); color: #fff; border-bottom-right-radius: 3px; }
.chat-form { border-top: 1px solid var(--line); padding: 11px; display: flex; gap: 8px; }
.chat-form input { flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 11px; outline: none; }
.email-shell { background: #e9eaec; padding: 26px; border-radius: 14px; }
.email { max-width: 590px; margin: auto; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 12px 35px -20px rgba(0,0,0,.4); }
.email-head { background:#0a0b0d; color:#fff; padding:20px 26px; display:flex; align-items:center; justify-content:space-between; }
.email-body { padding: 28px; font-size: 12px; line-height: 1.7; color: #4c4f55; }
.email-body h1 { font-size: 23px; color: #0a0b0d; letter-spacing: -.035em; }
.email-details { border: 1px solid #e7e8ea; border-radius: 8px; overflow: hidden; margin: 17px 0; }
.email-details div { display:flex; justify-content:space-between; gap:10px; padding: 10px 12px; border-bottom:1px solid #eef0f2; }
.email-details div:last-child { border-bottom:0; }
.email-details span:first-child { color:#7b7e84; }
.email-foot { padding: 15px 26px; border-top:1px solid #eef0f2; color:#8c9097; font-size:9px; }
.public-nav { height:66px; display:flex; align-items:center; gap:20px; padding:0 28px; background:#fff; border-bottom:1px solid var(--line); }
.public-nav .brand { padding:0; color:var(--ink); }
.public-nav .logo { background:var(--ink); color:#fff; }
.public-nav .links { display:flex; gap:18px; margin-left:18px; font-size:11px; color:#656970; }
.public-nav .right { margin-left:auto; display:flex; gap:8px; }
.hero { background:#0a0b0d; color:#fff; padding:70px 30px; position:relative; overflow:hidden; }
.hero:after { content:""; position:absolute; width:600px; height:600px; border-radius:50%; border:1px solid rgba(255,255,255,.08); right:-180px; top:-240px; }
.hero-inner { max-width:1060px; margin:auto; position:relative; z-index:1; }
.hero h1 { font-size:58px; line-height:1.01; letter-spacing:-.06em; margin:14px 0 0; max-width:620px; }
.hero p { color:rgba(255,255,255,.55); font-size:13px; line-height:1.75; max-width:480px; }
.hero .btn { margin-top:20px; }
.public-content { max-width:1060px; margin:auto; padding:28px; }
.feature-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:-34px; position:relative; z-index:2; }
.feature { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; }
.feature strong { display:block; font-size:11px; margin-top:8px; }
.feature span { display:block; font-size:9.5px; color:var(--muted); line-height:1.5; margin-top:4px; }
.mobile-bottom { display:none; }
.fade-up { animation: fadeUp .5s cubic-bezier(.22,1,.36,1) both; }
@keyframes fadeUp { from { opacity:0; transform:translateY(9px); } to { opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce) { .fade-up { animation:none; } }
@media (max-width: 980px) {
  .sidebar { display:none; }
  .main { margin-left:0; width:100%; }
  .topbar { padding:0 14px; height:56px; }
  .content { padding:18px; }
  .two, .detail-grid { grid-template-columns:1fr; }
  .three { grid-template-columns:1fr 1fr; }
  h1 { font-size:25px; }
  .login-wrap { grid-template-columns:1fr; }
  .login-art { min-height:240px; padding:28px; }
  .login-art h2 { font-size:30px; margin-top:24px; }
  .login-box { padding:20px; }
  .hero { padding:48px 20px 58px; }
  .hero h1 { font-size:42px; }
  .public-content { padding:18px; }
  .feature-grid { grid-template-columns:1fr 1fr; }
  .mobile-bottom { display:flex; position:fixed; bottom:0; left:0; right:0; height:58px; background:#fff; border-top:1px solid var(--line); z-index:40; justify-content:space-around; align-items:center; }
  .mobile-bottom a { font-size:8.5px; color:#7b7e84; display:grid; justify-items:center; gap:3px; }
  .mobile-bottom a.active { color:var(--ink); font-weight:700; }
  .mobile-bottom svg { width:17px; height:17px; }
  .content { padding-bottom:80px; }
  .topbar .search { display:none; }
  .withdraw-banner { align-items:flex-start; flex-direction:column; }
  .public-nav .links { display:none; }
  .campaign-inner { padding:18px; }
  .email-shell { padding:8px; }
  .email-body { padding:20px; }
}
@media (max-width: 480px) {
  .three { grid-template-columns:1fr 1fr; }
  .feature-grid { grid-template-columns:1fr; }
  .hero h1 { font-size:37px; }
  .reward-grid { gap:8px; }
  .reward { padding:12px; }
  .reward strong { font-size:28px; }
  .top-actions .demo-pill { display:none; }
}
</style>
</head>
<body>
  <div id="app"></div>
  <script>(function () {
  const WAT = (d = new Date()) => new Intl.DateTimeFormat("en-NG", { timeZone:"Africa/Lagos", day:"numeric", month:"long", year:"numeric", hour:"numeric", minute:"2-digit", hour12:true }).format(d);
  const generatedAtWat = WAT(new Date());
  const demoUser = {
    id:"user-ambassador", email:"nicksonlabss@gmail.com", password:"Ambassador125!", name:"Nickson", role:"Ambassador", joined:"October 2026", balanceMinor:4850000,
    ambassador:{ availableCents:12500, earnedCents:24900, paidCents:12400, qualified:18, total:42, pending:6, rejected:2, nextPayout:"20 December 2026" },
    withdrawal:{ id:"WD-DEMO-125", amountCents:12500, requestedAt:"12 November 2026", sentAt:"15 November 2026", generatedAtWat, network:"BEP20", address:"0xdD48bb481dA3cb0C2FE276a28Bf473A1011Ce9df", campaign:"Ambassador Referral Campaign", reference:"DEMO-AMB-20261112-125", status:"Simulated — Sent" },
    transactions:[
      { id:"TX-1007", title:"Wallet deposit", date:"14 Nov 2026, 10:30 AM", amountMinor:6000000, status:"Completed" },
      { id:"TX-1006", title:"Proxy purchase", date:"13 Nov 2026, 04:15 PM", amountMinor:-100000, status:"Completed" },
      { id:"TX-1005", title:"Referral reward", date:"12 Nov 2026, 09:20 AM", amountMinor:100000, status:"Completed" },
      { id:"TX-1004", title:"Wallet deposit", date:"11 Nov 2026, 02:40 PM", amountMinor:1000000, status:"Completed" }
    ],
    notifications:[
      { id:"N-1", title:"Ambassador withdrawal sent", body:"Your $125.00 USDT withdrawal was marked sent on 15 November 2026.", date:"15 Nov 2026", unread:true },
      { id:"N-2", title:"Referral qualified", body:"Tunde completed a qualifying 7-day proxy purchase. $3.00 was added to your Ambassador balance.", date:"14 Nov 2026", unread:true },
      { id:"N-3", title:"Payment received", body:"Your deposit of ₦60,000 was received and credited to your wallet.", date:"14 Nov 2026", unread:false }
    ]
  };
  const key = "buybiz_demo_static_user";
  const getStored = () => { try { return JSON.parse(localStorage.getItem(key) || "null"); } catch { return null; } };
  const store = (u) => localStorage.setItem(key, JSON.stringify(u));
  const reply = (message, user) => {
    const t = message.toLowerCase();
    if (/withdraw|125|ambassador|payout/.test(t)) return `Your $125.00 Ambassador withdrawal was marked sent on 15 November 2026 to ${user.withdrawal?.address?.slice(0,8)}… on BEP20. This is the demo record ${user.withdrawal?.reference}. Open Withdrawals → details for the full timeline and copy address.`;
    if (/proxy|marketplace|stock|country/.test(t)) return "This demo includes US, UK, Canada and Australia proxy inventory. In the real BUYBIZ marketplace you choose a country, then a 7-day+ plan, and availability is checked at checkout.";
    if (/wallet|deposit|payment/.test(t)) return "Your demo wallet balance is ₦48,500.00. Deposits only appear as credited after server-side payment verification; a browser success screen alone never credits a wallet.";
    if (/referral|campaign|\$10|\$3/.test(t)) return "The demo Ambassador balance shows $125.00 available. The $3 Ambassador programme is ongoing with a next payout of 20 December 2026, while the $10 customer/referrer campaign is separate.";
    return "I can help with your demo wallet, proxy plans, Ambassador earnings, withdrawals and notifications. This educational demo only simulates account activity.";
  };
  const respond = (status, body) => new Response(JSON.stringify(body), { status, headers:{ "Content-Type":"application/json" } });
  const originalFetch = window.fetch.bind(window);
  window.fetch = async (input, init = {}) => {
    const path = new URL(input, location.href).pathname;
    if (path.endsWith("/api/session") && (!init.method || init.method === "GET")) {
      const user = getStored();
      return respond(200, user ? { authenticated:true, user, generatedAtWat } : { authenticated:false });
    }
    if (path.endsWith("/api/login")) {
      let body = {}; try { body = JSON.parse(init.body || "{}"); } catch {}
      if (String(body.email || "").toLowerCase() === demoUser.email && body.password === demoUser.password) {
        const user = { ...demoUser, withdrawal: { ...demoUser.withdrawal, generatedAtWat: WAT(new Date()) } };
        store(user); return respond(200, { ok:true, user });
      }
      return respond(401, { message:"Incorrect email or password." });
    }
    if (path.endsWith("/api/logout")) { localStorage.removeItem(key); return respond(200, { ok:true }); }
    if (path.endsWith("/api/register")) {
      let body = {}; try { body = JSON.parse(init.body || "{}"); } catch {}
      if (!body.email || !body.name) return respond(400, { message:"Enter your name and email." });
      const user = { id:"user-"+Date.now(), email:String(body.email).toLowerCase(), name:String(body.name), role:"Customer", joined:"November 2026", balanceMinor:0, ambassador:{ availableCents:0, earnedCents:0, paidCents:0, qualified:0, total:0, pending:0, rejected:0, nextPayout:"20 December 2026" }, withdrawal:null, transactions:[], notifications:[] };
      store(user); return respond(200, { ok:true, user });
    }
    if (path.endsWith("/api/support")) {
      let body = {}; try { body = JSON.parse(init.body || "{}"); } catch {}
      const user = getStored() || demoUser;
      return respond(200, { reply:reply(String(body.message||""), user), demo:true });
    }
    return originalFetch(input, init);
  };
})();

const app = document.getElementById("app");
let state = { user: null, loading: true };
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const naira = (minor) => new Intl.NumberFormat("en-NG", { style:"currency", currency:"NGN", minimumFractionDigits: 2 }).format((Number(minor)||0)/100);

  const u=state.user, w=u.withdrawal;
  if(!w) return layout(`${head("Email preview","No withdrawal email.","The demo account has no withdrawal record.")}`, "/withdrawals");
  return layout(`${head("Email preview","Withdrawal notification.","Preview only — this email was not sent.",`<a href="#/withdrawals/${w.id}" data-link class="btn btn-outline btn-sm">Back to details</a>`)}<div class="email-shell"><div class="email"><div class="email-head"><div class="brand"><span class="logo">B</span><strong>BUYBIZ</strong></div><span class="tiny" style="color:rgba(255,255,255,.5)">TRANSACTIONAL EMAIL</span></div><div class="email-body"><div class="eyebrow" style="color:#16794a">BUYBIZ UPDATE</div><h1>Your Ambassador withdrawal was sent.</h1><p>Hello ${esc(u.name)},</p><p>Your Ambassador withdrawal of <strong>${usd(w.amountCents)} USDT</strong> was marked as sent on <strong>${esc(w.sentAt)}</strong>.</p><div class="email-details"><div><span>Amount</span><strong>${usd(w.amountCents)} USDT</strong></div><div><span>Campaign</span><strong>${esc(w.campaign)}</strong></div><div><span>Network</span><strong>${esc(w.network)}</strong></div><div><span>Wallet address</span><strong class="mono" style="font-size:10px">${short(w.address)}</strong></div><div><span>Requested</span><strong>${esc(w.requestedAt)}</strong></div><div><span>Sent</span><strong>${esc(w.sentAt)}</strong></div><div><span>Demo reference</span><strong class="mono" style="font-size:9px">${esc(w.reference)}</strong></div><div><span>Status</span><strong>Simulated — Sent</strong></div></div><p>This is an educational preview. No real email was sent and no blockchain transfer took place.</p><p>Warmly,<br><strong>The BUYBIZ team</strong></p></div><div class="email-foot">BUYBIZ demo · simulated transaction email · ${esc(w.generatedAtWat)} WAT</div></div></div>`, "/withdrawals");
}

function notFound() { return layout(`${head("404","Page not found.","This demo page does not exist.")}`, ""); }

function render() {
  const path = (window.location.hash.replace(/^#/, "") || "/").replace(/\/+$/,"") || "/";
  if (state.loading) { app.innerHTML = `<div class="login-wrap"><div class="login-box"><div class="login-card"><div class="brand"><span class="logo">B</span><strong>BUYBIZ</strong></div><p class="sub">Loading demo...</p></div></div></div>`; return; }
  const isAuth = Boolean(state.user);
  const publicRoutes = ["/","/login","/register"];
  if (!isAuth && !publicRoutes.includes(path)) { history.replaceState({}, "", "#/login"); return render(); }
  if (isAuth && (path === "/login" || path === "/register")) { history.replaceState({}, "", "#/dashboard"); return render(); }
  if (path === "/") { app.innerHTML = homePage(); return; }
  if (path === "/login") { app.innerHTML = loginPage(); return bindAuth(false); }
  if (path === "/register") { app.innerHTML = loginPage(true); return bindAuth(true); }
  if (path === "/dashboard") { app.innerHTML = dashboardPage(); return; }
  if (path === "/wallet") { app.innerHTML = walletPage(); return; }
  if (path === "/transactions") { app.innerHTML = transactionsPage(); return; }
  if (path === "/referrals") { app.innerHTML = referralsPage(); return; }
  if (path === "/withdrawals") { app.innerHTML = withdrawalsPage(); return; }
  if (path.startsWith("/withdrawals/")) { app.innerHTML = withdrawalDetailPage(path.split("/")[2]); return; }
  if (path === "/notifications") { app.innerHTML = notificationsPage(); return; }
  if (path === "/profile") { app.innerHTML = profilePage(); return; }
  if (path === "/support") { app.innerHTML = supportPage(); return; }
  if (path === "/email-preview") { app.innerHTML = emailPreviewPage(); return; }
  app.innerHTML = notFound();
}

function bindAuth(register) {
  const form = document.getElementById(register ? "register-form" : "login-form");
  if (!form) return;
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const data = Object.fromEntries(new FormData(form));
    const response = await fetch(register ? "/api/register" : "/api/login", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(data) });
    const payload = await response.json();
    if (!response.ok) { alert(payload.message || "Could not sign in."); return; }
    state.user = payload.user; state.loading = false; history.pushState({}, "", "#/dashboard"); render();
  });
}

document.addEventListener("click", async (event) => {
  const link = event.target.closest("a[data-link]");
  if (link) {
    event.preventDefault();
    const href = link.getAttribute("href");
    history.pushState({}, "", href);
    window.scrollTo({ top:0 });
    render();
    return;
  }
  const copy = event.target.closest("[data-copy]");
  if (copy) {
    try { await navigator.clipboard.writeText(copy.dataset.copy); copy.innerHTML = "Copied"; setTimeout(()=>render(), 1000); } catch {}
    return;
  }
  const demo = event.target.closest("[data-demo-action]");
  if (demo) { alert("This is an isolated demo. No real wallet action was taken."); return; }
  const question = event.target.closest("[data-question]");
  if (question) { const input=document.getElementById("chat-input"); if(input){input.value=question.dataset.question; input.focus();} }
});
window.addEventListener("popstate", render); window.addEventListener("hashchange", render);

document.addEventListener("submit", async (event) => {
  if (event.target.id !== "chat-form") return;
  event.preventDefault();
  const input = document.getElementById("chat-input");
  const messages = document.getElementById("messages");
  const text = input.value.trim();
  if (!text) return;
  messages.insertAdjacentHTML("beforeend", `<div class="msg user">${esc(text)}</div>`);
  input.value = "";
  const response = await fetch("/api/support", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ message:text }) });
  const payload = await response.json();
  messages.insertAdjacentHTML("beforeend", `<div class="msg bot">${esc(payload.reply || "Please try again.")}</div>`);
  messages.scrollTop = messages.scrollHeight;
});

fetch("/api/session", { cache:"no-store" }).then(r=>r.json()).then(payload => { state.user = payload.user || null; state.loading=false; render(); }).catch(()=>{ state.loading=false; render(); });
</script>
</body>
</html>
