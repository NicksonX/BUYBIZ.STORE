# BUYBIZ Render blueprint.
# Apply after creating the Supabase project and running the migrations.
# Set every sync:false value in the Render dashboard before the first deploy.
services:
  - type: web
    name: buybiz
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.22.2
      - key: DEMO_MODE
        value: "false"
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: PROXY_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_MODE
        value: test
      - key: CRON_SECRET
        sync: false
      - key: OFFICIAL_SUPPORT_EMAIL
        sync: false
      - key: RATE_LIMIT_SALT
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_SUPPORT_EMAIL
        sync: false
      - key: EMAIL_OTP_SECRET
        sync: false
      - key: NEXT_PUBLIC_AUTH_GOOGLE_ENABLED
        value: "true"
      - key: ENABLE_WALLET_TRANSFERS
        value: "false"
      - key: AI_SUPPORT_API_KEY
        sync: false
      - key: AI_SUPPORT_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_SUPPORT_MODEL
        value: gpt-4o-mini

# Lifecycle and scheduled follow-ups:
# Supabase pg_cron already runs the database lifecycle jobs.
# Schedule GET /api/cron/emails (Authorization: Bearer CRON_SECRET) from a free
# external HTTPS cron such as cron-job.org. No SMTP and no paid Render cron are required.
